name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-groups --frozen
      - run: make check

  integration:
    needs: check
    runs-on: ubuntu-latest   # Docker is available on GitHub-hosted Ubuntu runners
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-groups --frozen
      - run: make cov

  alerts:
    # AC-7 (S20): the alert rules are evaluated against their promtool tests. Pinned release.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install promtool 2.53.0
        run: |
          curl -sSL https://github.com/prometheus/prometheus/releases/download/v2.53.0/prometheus-2.53.0.linux-amd64.tar.gz | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/prometheus-2.53.0.linux-amd64" >> "$GITHUB_PATH"
      - run: promtool check rules deploy/observability/alerts.yml
      - run: promtool test rules deploy/observability/alerts_test.yml

  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every commit message follows CONTRIBUTING.md
        run: |
          set -e
          for sha in $(git rev-list origin/${{ github.base_ref }}..HEAD); do
            git log -1 --format=%B "$sha" > /tmp/msg
            python3 scripts/check_commit_msg.py /tmp/msg
          done
