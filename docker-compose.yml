# Local development only. Credentials here are throwaway defaults; never reuse them.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: te
      POSTGRES_PASSWORD: te
      POSTGRES_DB: transcribe
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U te -d transcribe"]
      interval: 2s
      retries: 30

  minio:
    image: cgr.dev/chainguard/minio@sha256:f6243be11aaaa2fe654d260558e2b3fcef50135e78a3abfd0db802b13444f059
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: te-local
      MINIO_ROOT_PASSWORD: te-local-secret
      # Server-side encryption (SSE-S3) needs a KMS key; this one is a throwaway local value (S07, D-014).
      MINIO_KMS_SECRET_KEY: local-test:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      retries: 30

  # Production-like ASR on a GPU (ADR-0005, D-067). Only with `--profile asr-gpu`: it needs an NVIDIA
  # GPU with BF16 (Ampere or newer).
  # --trust-remote-code runs code from the model repo; review it before enabling (REVIEW_QUEUE R-014).
  vllm:
    profiles: ["asr-gpu"]
    image: vllm/vllm-openai:v0.19.0
    # Model pinned to the reviewed commit (R-014, approved 2026-11-27). The model is gated: the access
    # token is read from the environment at run time and is never written here.
    command: ["--model", "CohereLabs/cohere-transcribe-arabic-07-2026", "--revision", "c3e911b42149bf7a1e53d5cef9878aee87515a23", "--dtype", "bfloat16", "--trust-remote-code", "--port", "8000"]
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    ports: ["8001:8000"]  # host 8001: the dev API uses host 8000
    volumes: [hfcache:/root/.cache/huggingface]
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: all, capabilities: [gpu]}]

volumes:
  pgdata:
  miniodata:
  hfcache:
