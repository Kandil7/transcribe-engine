# Local hooks only: they run the same tools as `make check`, pinned by uv.lock.
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: no-secrets-files
        name: block .env and key files
        entry: "Do not commit secrets"
        language: fail
        files: '(^|/)(\.env(\..*)?|.*\.pem|.*\.key)$'
        exclude: '^\.env\.example$'
      - id: commit-msg
        name: conventional commit with slice scope
        entry: uv run python scripts/check_commit_msg.py
        language: system
        stages: [commit-msg]
